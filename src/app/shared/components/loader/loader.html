<!-- Full Screen Loader Ovelay -->
@if (isLoading()) {
  <div
    class="fixed inset-0 bg-black bg-opacity-50 z-[9999] flex items-center justify-center animate-fade-in"
  >
    <div class="bg-white rounded-2xl p-8 shadow-2xl text-center animate-bounce-in">
      <!-- Material Spinner -->
      <mat-spinner diameter="60" class="mx-auto" color="primary"></mat-spinner>
      <!-- Loading text -->
      <p class="mt-4 text-gray-700 font-semobold text-lg">Loading...</p>
      <p class="text-sm ext-gray-500 mt-1">Pleas wait</p>
    </div>
  </div>
}
